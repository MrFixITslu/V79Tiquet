services:
  v79-tiquet-manager:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: v79-tiquet-manager
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=3050
      - DB_HOST=tiquet-postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-tiquet}
      - DB_USER=${DB_USER:-tiquet_app}
      - DB_PASSWORD=${DB_PASSWORD}
      - DATABASE_PATH=/app/data/tiquet.db
    # No `ports:` mapping on purpose. Nginx Proxy Manager reaches this
    # container over the shared `proxy_network` by container name + internal
    # port (v79-tiquet-manager:3050 — this MUST match the PORT env var below;
    # NPM's Proxy Host "Forward Port" must be set to 3050, not 8080, or every
    # request 502s) — it does not need, and shouldn't use,
    # a host port mapping. This also means this app can never collide with
    # anything else's host port (3000 or otherwise), since nothing here
    # binds to the host at all. If you ever need to hit it directly from the
    # host for debugging, temporarily add:
    #   ports:
    #     - "3050:3050"
    volumes:
      - tiquet_data:/app/data
      - tiquet_uploads:/app/uploads
    healthcheck:
      # Use 127.0.0.1, not localhost: Alpine/musl resolves "localhost" to the
      # IPv6 loopback (::1) first, and BusyBox wget doesn't fall back to IPv4
      # on ECONNREFUSED — so this check was failing even though the app
      # (bound to 0.0.0.0) was reachable fine from anywhere outside the
      # container, including Nginx Proxy Manager. See v79-tiquet-manager
      # incident 2026-08-11: "Up (unhealthy)" for 4 days with a fully healthy
      # app underneath.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3050/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - proxy_network
      - tiquet_internal
    # Production database runs on PostgreSQL (tiquet-postgres container).
    # If the Postgres database is uninitialized and existing SQLite data is detected
    # at /app/data/tiquet.db, server/db.js automatically bootstraps and migrates all data safely.
    depends_on:
      tiquet-postgres:
        condition: service_healthy

  tiquet-postgres:
    image: postgres:16-alpine
    container_name: tiquet-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      - POSTGRES_DB=${DB_NAME:-tiquet}
      - POSTGRES_USER=${DB_USER:-tiquet_app}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    # No `ports:` mapping — Postgres is reachable only from other containers
    # on tiquet_internal (i.e. v79-tiquet-manager). It is never exposed to
    # proxy_network or the host. If you need to inspect it manually from the
    # host during migration testing, temporarily add "127.0.0.1:5432:5432"
    # (bind to loopback only, never "5432:5432" / 0.0.0.0) and remove it
    # again afterward.
    volumes:
      - tiquet_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tiquet_app} -d ${DB_NAME:-tiquet}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - tiquet_internal

volumes:
  tiquet_data:
  tiquet_uploads:
  tiquet_pg_data:

networks:
  proxy_network:
    # Must match the network your Nginx Proxy Manager container is attached
    # to. Verify with `docker network ls` on the server — if NPM's compose
    # file defines it under a different name, change it here to match.
    external: true
  tiquet_internal:
    # Private network for the app <-> Postgres only. internal:true means
    # Docker gives this network no default route to the outside world at
    # all — Postgres has no path in or out except to containers also on
    # this network (i.e. v79-tiquet-manager), independent of any firewall
    # rules. v79-tiquet-manager stays reachable externally via its separate
    # proxy_network attachment above.
    internal: true
