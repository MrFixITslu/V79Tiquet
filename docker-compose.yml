services:
  v79-tiquet-manager:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: v79-tiquet-manager
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=3050
      - DB_HOST=tiquet-postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-tiquet}
      - DB_USER=${DB_USER:-tiquet_app}
      - DB_PASSWORD=${DB_PASSWORD}
      - DATABASE_PATH=/app/data/tiquet.db
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - APP_BASE_URL=${APP_BASE_URL:-https://tiquet.v79sl.com}
      - V79_HUB_EVENT_URL=${V79_HUB_EVENT_URL:-http://v79-hub:3040/api/platform/events}
      - V79_HUB_EVENT_SECRET=${V79_HUB_EVENT_SECRET:-}
      - V79_PLATFORM_SHARED_SECRET=${V79_PLATFORM_SHARED_SECRET:-}
      - V79_HUB_PUBLIC_URL=${V79_HUB_PUBLIC_URL:-https://hub.v79sl.com}
      - V79_HUB_INTERNAL_URL=${V79_HUB_INTERNAL_URL:-http://v79-hub:3040}
      - V79_TIQUET_LAUNCH_SECRET=${V79_TIQUET_LAUNCH_SECRET:-}
      - V79_ALLOW_LEGACY_AUTH=${V79_ALLOW_LEGACY_AUTH:-0}
      - V79_ALLOW_EMAIL_ACCOUNT_LINK=${V79_ALLOW_EMAIL_ACCOUNT_LINK:-0}
      - V79_HUB_MANAGED_BILLING=${V79_HUB_MANAGED_BILLING:-1}
    expose:
      - "3050"
    volumes:
      - tiquet_data:/app/data
      - tiquet_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3050/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - proxy_network
    depends_on:
      tiquet-postgres:
        condition: service_healthy

  tiquet-postgres:
    image: postgres:16-alpine
    container_name: tiquet-postgres
    restart: unless-stopped
    stop_grace_period: 60s
    env_file: .env
    environment:
      - POSTGRES_DB=${DB_NAME:-tiquet}
      - POSTGRES_USER=${DB_USER:-tiquet_app}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - tiquet_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tiquet_app} -d ${DB_NAME:-tiquet}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    networks:
      - proxy_network

volumes:
  tiquet_data:
  tiquet_uploads:
  tiquet_pg_data:

networks:
  proxy_network:
    # Shared external network used by Nginx Proxy Manager and application containers
    external: true
