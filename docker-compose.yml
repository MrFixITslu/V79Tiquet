services:
  v79-tiquet-manager:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: v79-tiquet-manager
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DATABASE_PATH=/app/data/tiquet.db
    # No `ports:` mapping on purpose. Nginx Proxy Manager reaches this
    # container over the shared `proxy_network` by container name + internal
    # port (v79-tiquet-manager:8080) — it does not need, and shouldn't use,
    # a host port mapping. This also means this app can never collide with
    # anything else's host port (3000 or otherwise), since nothing here
    # binds to the host at all. If you ever need to hit it directly from the
    # host for debugging, temporarily add:
    #   ports:
    #     - "8080:8080"
    volumes:
      - tiquet_data:/app/data
      - tiquet_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - proxy_network

volumes:
  tiquet_data:
  tiquet_uploads:

networks:
  proxy_network:
    # Must match the network your Nginx Proxy Manager container is attached
    # to. Verify with `docker network ls` on the server — if NPM's compose
    # file defines it under a different name, change it here to match.
    external: true
