services:
  v79-tiquet-manager:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: v79-tiquet-manager
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DATABASE_PATH=/app/data/tiquet.db
      # Detected automatically by Nginx Proxy Manager on the shared proxy_network.
      - VIRTUAL_HOST=
      - VIRTUAL_PORT=8080
      - LETSENCRYPT_HOST=tiquet.v79sl.duckdns.org
    ports:
      # Kept from the original V79Tiquet compose file — do not change unless
      # you also update the NPM proxy host entry for tiquet.v79sl.duckdns.org.
      - "8080:8080"
    volumes:
      - tiquet_data:/app/data
      - tiquet_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - proxy_network

volumes:
  tiquet_data:
  tiquet_uploads:

networks:
  proxy_network:
    external: true
