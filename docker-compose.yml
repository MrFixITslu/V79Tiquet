services:
  v79-tiquet-manager:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: v79-tiquet-manager
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=3050
      - DATABASE_PATH=/app/data/tiquet.db
    # No `ports:` mapping on purpose. Nginx Proxy Manager reaches this
    # container over the shared `proxy_network` by container name + internal
    # port (v79-tiquet-manager:3050 — this MUST match the PORT env var below;
    # NPM's Proxy Host "Forward Port" must be set to 3050, not 8080, or every
    # request 502s) — it does not need, and shouldn't use,
    # a host port mapping. This also means this app can never collide with
    # anything else's host port (3000 or otherwise), since nothing here
    # binds to the host at all. If you ever need to hit it directly from the
    # host for debugging, temporarily add:
    #   ports:
    #     - "3050:3050"
    volumes:
      - tiquet_data:/app/data
      - tiquet_uploads:/app/uploads
    healthcheck:
      # Use 127.0.0.1, not localhost: Alpine/musl resolves "localhost" to the
      # IPv6 loopback (::1) first, and BusyBox wget doesn't fall back to IPv4
      # on ECONNREFUSED — so this check was failing even though the app
      # (bound to 0.0.0.0) was reachable fine from anywhere outside the
      # container, including Nginx Proxy Manager. See v79-tiquet-manager
      # incident 2026-08-11: "Up (unhealthy)" for 4 days with a fully healthy
      # app underneath.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3050/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - proxy_network

volumes:
  tiquet_data:
  tiquet_uploads:

networks:
  proxy_network:
    # Must match the network your Nginx Proxy Manager container is attached
    # to. Verify with `docker network ls` on the server — if NPM's compose
    # file defines it under a different name, change it here to match.
    external: true
