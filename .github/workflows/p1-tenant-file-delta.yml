name: P1 production-mode tenant file boundaries (isolated)
on:
  push:
    paths:
      - server/index.js
      - tests/p1-tenant-file-delta.test.cjs
      - .github/workflows/p1-tenant-file-delta.yml
  pull_request:
    paths:
      - server/index.js
      - tests/p1-tenant-file-delta.test.cjs
      - .github/workflows/p1-tenant-file-delta.yml
permissions:
  contents: read
jobs:
  fresh-database-and-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tiquet_test
          POSTGRES_PASSWORD: tiquet_test_password
          POSTGRES_DB: tiquet_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U tiquet_test -d tiquet_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://tiquet_test:tiquet_test_password@127.0.0.1:5432/tiquet_test
      JWT_SECRET: ci_jwt_secret_0123456789abcdef0123456789abcdef
      CI_TENANT_FILE_DELTA: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --check tests/p1-tenant-file-delta.test.cjs
      - run: node tests/p1-tenant-file-delta.test.cjs
