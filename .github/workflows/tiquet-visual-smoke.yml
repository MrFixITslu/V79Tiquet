name: Tiquet actual UI visual smoke (synthetic, no deploy)

# PR-only; renders candidate React UI with intercepted synthetic /api responses.
# No production credentials, Docker host, tailnet, deployment or payment writes.
on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/tiquetVisualSmoke.cjs"
      - ".github/workflows/tiquet-visual-smoke.yml"
      - "package.json"
      - "package-lock.json"
      - "index.html"

permissions:
  contents: read

concurrency:
  group: v79-tiquet-visual-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  browser-visual-acceptance:
    name: Render 16 screenshots / check role-limited navigation
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      NODE_ENV: test
      GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      V79_VISUAL_DIR: visual-review-artifacts
    steps:
      - name: Check out exact PR source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install application dependencies
        run: npm ci --no-audit --no-fund
      - name: Install disposable Playwright test dependencies (no lock changes)
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start Vite front end only (no API or database)
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/vite --host 127.0.0.1 --port 4173 --strictPort > /tmp/v79-visual-vite.log 2>&1 &
          for attempt in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/v79-visual-vite.log
          exit 1
      - name: Capture real React UI using only fake test records
        run: node tests/tiquetVisualSmoke.cjs
      - name: Upload source-derived QA screenshots and notes (not production data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiquet-pr48-synthetic-visual-review-${{ github.event.pull_request.head.sha }}
          path: visual-review-artifacts/
          retention-days: 14
          if-no-files-found: warn
      - name: Print visual Vite log if test failed
        if: failure()
        run: cat /tmp/v79-visual-vite.log || true
