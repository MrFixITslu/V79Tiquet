name: V79 CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: v79-ci-cd-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tiquet_test
          POSTGRES_USER: tiquet_test
          POSTGRES_PASSWORD: tiquet_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tiquet_test -d tiquet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://tiquet_test:tiquet_test_password@127.0.0.1:5432/tiquet_test
      JWT_SECRET: ci_jwt_secret_0123456789abcdef0123456789abcdef
      SUPER_ADMIN_JWT_SECRET: ci_admin_secret_0123456789abcdef0123456789abcdef
      V79_PLATFORM_SHARED_SECRET: ci_platform_secret_0123456789abcdef0123456789abcdef
      SEED_DEMO_DATA: "false"
      # Existing security tests still exercise the compatibility auth path.
      # Production remains Hub-only because V79_ALLOW_LEGACY_AUTH defaults to 0.
      V79_ALLOW_LEGACY_AUTH: "1"
      # E2E compatibility suite still verifies the historical Stripe stub.
      # Production defaults to Hub-managed billing.
      V79_HUB_MANAGED_BILLING: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript check
        run: npm run lint
      - name: Production frontend build
        run: npm run build
      - name: Start API for integration tests
        shell: bash
        run: |
          set -euo pipefail
          npm run server > /tmp/v79-tiquet-ci.log 2>&1 &
          echo $! > /tmp/v79-tiquet-ci.pid
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:3000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/v79-tiquet-ci.log
          exit 1
      - name: API security and workflow tests
        run: npm test
      - name: Verify Docker image can build
        run: docker build --tag v79-tiquet-ci .
      - name: Show API log on failure
        if: failure()
        run: cat /tmp/v79-tiquet-ci.log || true
      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/v79-tiquet-ci.pid ]; then kill "$(cat /tmp/v79-tiquet-ci.pid)" || true; fi
      - name: Create delivery bundle
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=.env --exclude='.env.*' \
              --exclude=data --exclude=uploads --exclude=backups --exclude=dist --exclude='*.tar.gz' \
              -czf "${RUNNER_TEMP}/${GITHUB_REPOSITORY##*/}-${GITHUB_SHA::12}.tar.gz" .
      - name: Upload delivery bundle
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/*.tar.gz
          retention-days: 14
          if-no-files-found: error

  deliver-container:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish immutable image
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          SHORT_SHA="${GITHUB_SHA::12}"
          docker build -t "$IMAGE:latest" -t "$IMAGE:$SHORT_SHA" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$SHORT_SHA"

  deploy:
    name: Deploy validated release to server
    runs-on: ubuntu-latest
    needs: [validate, deliver-container]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    environment: production
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/release
      - name: Join deployment tailnet
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          ping: ${{ secrets.DEPLOY_HOST }}
      - name: Configure pinned SSH host
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
      - name: Transfer and deploy release
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
          DEPLOY_PROJECT: ${{ vars.DEPLOY_PROJECT }}
        run: |
          set -euo pipefail
          for name in RELEASE_SHA DEPLOY_HOST DEPLOY_USER DEPLOY_ROOT DEPLOY_PROJECT; do
            test -n "${!name}" || { echo "Missing production setting: $name" >&2; exit 1; }
          done
          port="${DEPLOY_SSH_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]] || exit 1
          archive="$(find "$RUNNER_TEMP/release" -maxdepth 1 -name '*.tar.gz' -type f -print -quit)"
          test -n "$archive"
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          scp -P "$port" -o StrictHostKeyChecking=yes "$archive" "$target:v79-release-${RELEASE_SHA}.tar.gz"
          ssh -p "$port" -o StrictHostKeyChecking=yes "$target" bash -s -- "$RELEASE_SHA" "$DEPLOY_ROOT" "$DEPLOY_PROJECT" "v79-tiquet-manager" < scripts/deploy-server.sh
