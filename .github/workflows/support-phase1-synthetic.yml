name: Tiquet Support Phase 1 - Synthetic Only
on:
  push:
    branches:
      - feature/support-desk-phase1-20261024
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-support:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: support_test
          POSTGRES_PASSWORD: support_test_password
          POSTGRES_DB: tiquet_support_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U support_test -d tiquet_support_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      CI_SUPPORT_SYNTHETIC: "1"
      NODE_ENV: test
      DATABASE_URL: postgresql://support_test:support_test_password@127.0.0.1:5432/tiquet_support_test
      V79_SUPPORT_DESK_ENABLED: "0"
      V79_ALLOW_LEGACY_AUTH: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Assert isolated feature branch and disposable target
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feature/support-desk-phase1-20261024"
          test "$CI_SUPPORT_SYNTHETIC" = "1"
          test "$NODE_ENV" = "test"
          test "$V79_SUPPORT_DESK_ENABLED" = "0"
          [[ "$DATABASE_URL" == *"@127.0.0.1:5432/tiquet_support_test" ]]
          if [ -n "$(git ls-files -- data uploads logs)" ]; then
            echo "STOP: runtime data tracked in git" >&2
            exit 1
          fi
      - name: Install dependencies - no external actions
        run: npm ci --no-audit --no-fund
      - name: Syntax and isolated support unit tests
        run: |
          node --check server/support/contracts.js
          node --check server/support/permissions.js
          node --check server/support/router.js
          node --check tests/supportPhase1.integration.mjs
          node --test tests/supportPhase1.test.js
      - name: Synthetic local PostgreSQL integration
        run: node --test tests/supportPhase1.integration.mjs
      - name: Phase 2 mock mail syntax and unit contracts
        run: |
          node --check server/support/mailContracts.js
          node --check server/support/syntheticMail.js
          node --check tests/supportPhase2.integration.mjs
          node --test tests/supportPhase2.test.js
      - name: Phase 2 disposable PostgreSQL and mock provider scenarios
        run: node --test tests/supportPhase2.integration.mjs
      - name: Phase 4 business hours and SLA unit contracts
        run: |
          node --check server/support/businessHours.js
          node --check server/support/phase4Service.js
          node --check server/support/phase4Router.js
          node --check tests/supportPhase4.integration.mjs
          node --test tests/supportPhase4.test.js
      - name: Phase 4 disposable PostgreSQL, agent leases and rule idempotency
        run: node --test tests/supportPhase4.integration.mjs
      - name: Phase 3 standalone agent UI build
        run: |
          node --check src/navigationState.js
          npx vite build --config tests/support-ui/vite.config.ts
          test -s .support-ui-build/index.html
          test ! -e dist/support-sandbox.html
      - name: Phase 3 isolated UX and typed API contracts
        run: |
          node --check tests/support-ui/fixtureServer.mjs
          node --check tests/support-ui/fixtureSmoke.mjs
          node --test tests/support-ui/contract.test.mjs
      - name: Phase 3 synthetic HTTP workbench contract
        shell: bash
        run: |
          set -euo pipefail
          CI_SUPPORT_UI_FIXTURE=1 node tests/support-ui/fixtureServer.mjs > /tmp/tiquet-support-ui-fixture.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3088/sandbox/health >/dev/null; then break; fi
            if ! kill -0 "$fixture_pid" 2>/dev/null; then
              cat /tmp/tiquet-support-ui-fixture.log
              exit 1
            fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:3088/sandbox/health >/dev/null
          node tests/support-ui/fixtureSmoke.mjs
          npx vite --config tests/support-ui/vite.config.ts --host 127.0.0.1 > /tmp/tiquet-support-ui-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4308/ >/dev/null; then break; fi
            if ! kill -0 "$vite_pid" 2>/dev/null; then
              cat /tmp/tiquet-support-ui-vite.log
              exit 1
            fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:4308/ >/dev/null
          node tests/support-ui/browserSmoke.mjs
      - name: Phase 5 security and 15000-ticket bounded performance
        run: |
          node --check tests/supportPhase5.performance.mjs
          node tests/supportPhase5.performance.mjs
      - name: Phase 5 disposable backup and isolated restore
        shell: bash
        run: |
          set -euo pipefail
          bash tests/support-phase5-recovery.sh
      - name: Existing TypeScript and unit regression checks
        run: |
          npm run lint
          npm test
# No environment secrets, real email, GitHub packages, image build,
# artifact publication, SSH, Tailscale, deployment or production database.
